<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; padding: 14px; font: 14px "Microsoft YaHei UI", sans-serif; }
  label { display: block; margin: 8px 0 4px; font-size: 12px; color: #475569; }
  input {
    width: 100%; padding: 8px; box-sizing: border-box;
    border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px;
  }
  button {
    width: 100%; padding: 8px; margin-top: 8px;
    background: #2563eb; color: #fff; border: none; border-radius: 4px;
    font-size: 14px; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  #status { margin-top: 8px; color: #64748b; font-size: 12px; }
</style>
</head>
<body>
  <b>拼图助手</b>
  <label>验证码页面网址关键词（匹配即触发）</label>
  <input id="url" placeholder="如 example.com/captcha" />
  <button id="save">保存</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
